name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript compilation check
        run: npx tsc --noEmit

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          echo "Checking build output..."
          if [ -f "dist/bot.js" ]; then
            echo "✅ Build successful - dist/bot.js exists"
            ls -la dist/
          else
            echo "❌ Build failed - dist/bot.js not found"
            exit 1
          fi