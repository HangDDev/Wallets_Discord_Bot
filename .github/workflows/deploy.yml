name: Deploy to Railway

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Verify build
        run: |
          if [ ! -f "dist/bot.js" ]; then
            echo "❌ Build failed: dist/bot.js not found"
            exit 1
          fi

      - name: Deploy to Railway
        uses: railway-org/railway-action@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}